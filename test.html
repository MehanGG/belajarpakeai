<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Voxel Game Web</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
        }

        #instructions {
            text-align: center;
            color: #ffffff;
        }

        #instructions h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        #instructions p {
            font-size: 18px;
            line-height: 1.6;
            margin: 5px 0;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            text-shadow: 1px 1px 2px black;
        }
    </style>
    
    <!-- Import Map untuk Three.js dan Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Layar Start Screen -->
    <div id="blocker">
        <div id="instructions">
            <h1>Klik untuk Bermain</h1>
            <p><b>W, A, S, D</b> - Bergerak</p>
            <p><b>SPASI</b> - Lompat</p>
            <p><b>Mouse</b> - Melihat Sekeliling</p>
            <p><b>Klik Kiri</b> - Hancurkan Blok</p>
            <p><b>Klik Kanan</b> - Bangun Blok (Tanah)</p>
            <p style="margin-top:20px; font-size:14px; color:#cccccc;">Tekan ESC untuk menjeda / keluar dari mode kursor.</p>
        </div>
    </div>

    <!-- UI Crosshair -->
    <div id="crosshair">+</div>

    <!-- Script Utama Game -->
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. SETUP SCENE, CAMERA, DAN RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Warna langit
        scene.fog = new THREE.Fog(0x87ceeb, 10, 50);  // Efek kabut agar tidak terpotong tajam

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); // Ketinggian mata pemain

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. PENCAHAYAAN
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 30, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. GENERASI DUNIA (TERRAIN)
        const objects = []; // Array untuk menyimpan semua blok agar bisa dideteksi oleh Raycaster
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        
        // Material Warna
        const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x4da64d }); // Hijau Rumput
        const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x79553d });  // Coklat Tanah/Batu

        // Map berukuran 30x30 (dari -15 sampai 14)
        const mapSize = 15; 
        for (let x = -mapSize; x < mapSize; x++) {
            for (let z = -mapSize; z < mapSize; z++) {
                // Lapisan atas (Rumput)
                const grassBlock = new THREE.Mesh(blockGeometry, grassMaterial);
                grassBlock.position.set(x, 0, z);
                scene.add(grassBlock);
                objects.push(grassBlock);

                // Lapisan bawah (Tanah) - Dibuat 2 lapis agar terlihat tebal saat digali
                const dirtBlock1 = new THREE.Mesh(blockGeometry, dirtMaterial);
                dirtBlock1.position.set(x, -1, z);
                scene.add(dirtBlock1);
                objects.push(dirtBlock1);
                
                const dirtBlock2 = new THREE.Mesh(blockGeometry, dirtMaterial);
                dirtBlock2.position.set(x, -2, z);
                scene.add(dirtBlock2);
                objects.push(dirtBlock2);
            }
        }

        // 4. KONTROL DAN UI (POINTER LOCK API)
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            blocker.style.display = 'none';
        });

        controls.addEventListener('unlock', () => {
            blocker.style.display = 'flex';
        });

        scene.add(controls.getObject());

        // Variabel Fisika & Pergerakan
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;

        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // 5. EVENT LISTENER KEYBOARD
        const onKeyDown = (event) => {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveForward = true; break;
                case 'ArrowLeft':
                case 'KeyA': moveLeft = true; break;
                case 'ArrowDown':
                case 'KeyS': moveBackward = true; break;
                case 'ArrowRight':
                case 'KeyD': moveRight = true; break;
                case 'Space':
                    if (canJump === true) velocity.y += 8.5; // Kekuatan lompatan
                    canJump = false;
                    break;
            }
        };

        const onKeyUp = (event) => {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveForward = false; break;
                case 'ArrowLeft':
                case 'KeyA': moveLeft = false; break;
                case 'ArrowDown':
                case 'KeyS': moveBackward = false; break;
                case 'ArrowRight':
                case 'KeyD': moveRight = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // 6. MEKANIK MINING & BUILDING
        const actionRaycaster = new THREE.Raycaster();
        const screenCenter = new THREE.Vector2(0, 0);

        document.addEventListener('mousedown', (event) => {
            if (!controls.isLocked) return;

            actionRaycaster.setFromCamera(screenCenter, camera);
            const intersects = actionRaycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // Batasi jarak jangkauan menghancurkan/membangun (5 blok)
                if (intersect.distance > 5) return;

                if (event.button === 0) {
                    // KLIK KIRI: Menghancurkan (Remove)
                    scene.remove(intersect.object);
                    // Hapus dari array collision
                    const index = objects.indexOf(intersect.object);
                    if (index > -1) objects.splice(index, 1);
                } else if (event.button === 2) {
                    // KLIK KANAN: Membangun (Add)
                    // Ambil arah (normal) dari sisi blok yang diklik
                    const normal = intersect.face.normal;
                    const position = intersect.object.position.clone().add(normal);
                    
                    // Buat blok baru (kita gunakan blok tanah untuk blok yang dibangun pemain)
                    const newBlock = new THREE.Mesh(blockGeometry, dirtMaterial);
                    newBlock.position.copy(position);
                    scene.add(newBlock);
                    objects.push(newBlock);
                }
            }
        });

        // Mencegah menu klik kanan bawaan browser muncul
        document.addEventListener('contextmenu', (event) => event.preventDefault());

        // 7. RESPONSIVE RESIZE KETIKA JENDELA BERUBAH
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. ANIMASI & FISIKA (GRAVITASI & COLLISION)
        // Raycaster khusus menghadap ke bawah untuk deteksi pemain menginjak blok
        const downRaycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, -1, 0), 0, 10);

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                // Gesekan (Friction)
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 3.0 * delta; // Gravitasi

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Pastikan kecepatan diagonal sama dengan jalan lurus

                const speed = 40.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                // Hitung deteksi tabrakan dengan lantai
                const controlObj = controls.getObject();
                downRaycaster.ray.origin.copy(controlObj.position);
                downRaycaster.ray.origin.y -= 1.5; // Turunkan asal raycaster ke posisi kaki pemain (kamera ada di tinggi mata)

                const intersections = downRaycaster.intersectObjects(objects, false);
                const onObject = intersections.length > 0 && intersections[0].distance < 0.5;

                if (onObject === true) {
                    velocity.y = Math.max(0, velocity.y); // Setel kecepatan Y jadi 0 jika mendarat
                    canJump = true;
                    
                    // Snap / tahan pemain agar tidak tembus secara halus jika framerate drop
                    if (velocity.y <= 0) {
                        controlObj.position.y = intersections[0].point.y + 1.5; 
                    }
                } else {
                    canJump = false;
                }

                // Terapkan kalkulasi akhir pada kontrol kamera
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controlObj.position.y += (velocity.y * delta);

                // Mekanik Respawn jika pemain jatuh keluar map (di bawah ketinggian -10)
                if (controlObj.position.y < -10) {
                    velocity.y = 0;
                    controlObj.position.set(0, 10, 0); 
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        // Mulai Loop Game
        animate();
    </script>
</body>
</html>
